name: baltic tests

# Runs this repository's tests against a checkout of baltic.
#
# - On push/PR here and on a nightly schedule: tests baltic's default branch.
# - Manually (Actions tab > Run workflow): pick any baltic repo/ref.
# - From the baltic repo, as a reusable workflow:
#
#     jobs:
#       heavy-tests:
#         uses: phylo-baltic/baltic-tests/.github/workflows/tests.yml@main
#         with:
#           baltic-repository: ${{ github.repository }}
#           baltic-ref: ${{ github.sha }}

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      baltic-repository:
        description: baltic repository (owner/name)
        default: evogytis/baltic
      baltic-ref:
        description: branch, tag or SHA of baltic to test
        default: ""
      pytest-args:
        description: extra pytest arguments, e.g. -m "not slow"
        default: ""
  workflow_call:
    inputs:
      baltic-repository:
        type: string
        default: evogytis/baltic
      baltic-ref:
        type: string
        default: ""
      tests-ref:
        description: ref of baltic-tests to run
        type: string
        default: main
      pytest-args:
        type: string
        default: ""

concurrency:
  group: baltic-tests-${{ github.repository }}-${{ github.ref }}-${{ inputs.baltic-ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      # When called from the baltic repo, github.repository is baltic, so name this repo explicitly.
      # tests-ref is only set for workflow_call; otherwise the triggering ref here is used.
      - name: Check out baltic-tests
        uses: actions/checkout@v4
        with:
          repository: phylo-baltic/baltic-tests
          ref: ${{ inputs.tests-ref }}
          path: baltic-tests

      - name: Check out baltic
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.baltic-repository || 'evogytis/baltic' }}
          ref: ${{ inputs.baltic-ref }}
          path: baltic

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            baltic-tests/requirements.txt
            baltic/requirements.txt

      - name: Install baltic and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./baltic -r baltic-tests/requirements.txt

      - name: Record baltic version under test
        working-directory: baltic
        shell: bash
        run: echo "Testing $(git remote get-url origin) at $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        working-directory: baltic-tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest ${{ inputs.pytest-args }}
