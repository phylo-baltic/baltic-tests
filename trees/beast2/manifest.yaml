# BEAST 2 maximum clade credibility trees and networks.
# Field reference: see README.md ("Adding a tree file").

- file: MERS.mcc.tree.gz
  description: MERS-CoV structured coalescent MCC tree, 274 tips.
  source: baltic-examples/MERS-CoV
  loader: nexus
  kwargs: {treeType: time}

- file: genome.network.combined.mcc.tree.gz
